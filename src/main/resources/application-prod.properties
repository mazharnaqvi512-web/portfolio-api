# Active when SPRING_PROFILES_ACTIVE=prod (the Docker image sets it).
#
# The database is mandatory here, with no default: a hosting platform's disk is usually wiped on
# every restart or deploy, so falling back to the H2 file in application.properties would quietly
# lose every stored contact message. Without SPRING_DATASOURCE_URL the app refuses to start, with
# a message naming the missing variable.
#
# Example (PostgreSQL):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/DATABASE
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Never leave the H2 web console reachable on a hosted instance, whatever else is configured.
spring.h2.console.enabled=false
