spring.application.name=portfolio-api
# Hosting platforms tell the app which port to listen on through PORT.
server.port=${PORT:8080}

# Behind a reverse proxy (every hosting platform has one) the rate limiter must see the real
# visitor's address, not the proxy's, so set FORWARD_HEADERS_STRATEGY=native there. Left off by
# default because it makes the app believe X-Forwarded-For; see DEPLOY.md before switching it on.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# File-based H2: zero-install persistence for local development only. The "prod" profile
# (application-prod.properties) refuses to start on it and requires a real database instead.
spring.datasource.url=jdbc:h2:file:./data/portfolio
spring.datasource.username=sa
spring.datasource.password=

# Creates/updates tables from the entities. Fine for this stage; use real migrations (Flyway) once the schema matters.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health check for the hosting platform: GET /actuator/health answers {"status":"UP"} and nothing
# else is exposed (no env, beans, metrics, details). The mail check is off on purpose: the site
# must not be reported "down" because an SMTP server is.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Browser origins allowed to call /api/** (comma-separated). Override with the real site origin
# when deploying, e.g. CORS_ALLOWED_ORIGINS=https://example.com (never "*" for a site with forms).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# POST /api/contact: at most this many requests per client address within the window (spec section 47).
contact.rate-limit.max-requests=5
contact.rate-limit.window=10m

# Email each new contact message to the owner. Both contact.notify.to and a mail host must be set,
# otherwise messages are only stored. Everything comes from environment variables, never from this file:
#   CONTACT_NOTIFY_TO   where the notification goes (your own address)
#   CONTACT_NOTIFY_FROM sender; leave empty to use CONTACT_NOTIFY_TO (Gmail needs the sender to be the login account)
#   MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD   the SMTP server, e.g. smtp.gmail.com:587 with an app password
contact.notify.to=${CONTACT_NOTIFY_TO:}
contact.notify.from=${CONTACT_NOTIFY_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# A stuck mail server must never hang a thread for long.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# POST /api/ai/chat — the portfolio assistant. Every call costs money, so it has its own, tighter
# limits: per client address, plus a global cap per UTC day across everyone.
# The key is read from the ANTHROPIC_API_KEY environment variable and never logged; with no key the
# endpoint answers 503. The model is claude-opus-5-5 by default; set ai.anthropic.model to
# claude-haiku-5-5 for a far cheaper (and faster) assistant. Effort: low, medium, high, xhigh or max.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=claude-opus-5-5
ai.anthropic.effort=low
ai.anthropic.max-tokens=4096
ai.anthropic.timeout=30s
# Leave empty for Anthropic's own endpoint; set only to use a proxy or a local stand-in API.
ai.anthropic.base-url=
ai.rate-limit.max-requests=10
ai.rate-limit.window=10m
ai.daily-cap=100

# Stored messages are private visitor data and there is no auth yet — never expose a DB console.
spring.h2.console.enabled=false
