spring.application.name=portfolio-api

# Tests use a throwaway in-memory database so they never touch (or leave behind) the real ./data file.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Never let a test reach the real Anthropic API (it would cost money), even if ANTHROPIC_API_KEY is set on this machine.
ai.anthropic.api-key=
